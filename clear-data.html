<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Rescue IT Data</title>
    <link rel="stylesheet" href="./Home.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #F8FAFC;
        }

        .clear-box {
            max-width: 520px;
            width: 100%;
            padding: 32px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            background: #FFFFFF;
            text-align: center;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        }

        .clear-box h1 {
            margin-bottom: 12px;
            color: #0F172A;
            font-size: 28px;
        }

        .clear-box p {
            margin-bottom: 24px;
            color: #475569;
        }

        .clear-box a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            border-radius: 6px;
            background: #059669;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main class="clear-box">
        <h1>Page data cleared</h1>
        <p>Available Food listings, Charity dashboard donations, and cart items were removed from this browser.</p>
        <a href="prac.html">Back to Available Food</a>
    </main>

    <script>
        [
            'rescueit-listings',
            'rescueit-donations',
            'rescueCart'
        ].forEach(key => localStorage.removeItem(key));
    </script>
</body>

</html>
